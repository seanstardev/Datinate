<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Datinate Audio Player</title>

    <link rel="stylesheet" href="datinate-audio.css" />
</head>
<body>
    <main class="player">
        <header class="header">
            <div
                id="sourceTitle"
                class="source-title"
                hidden></div>

            <div class="title-row">
                <div class="title-spacer" aria-hidden="true"></div>

                <div id="trackTitle" class="track-title">
                    No track selected
                </div>

                <div class="title-actions">
                    <button
                        id="repeatButton"
                        class="icon-button title-action-button"
                        type="button"
                        title="Repeat playlist: Off"
                        aria-label="Repeat playlist"
                        aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M17.5 6H8.4L10.7 3.7L9.3 2.3L4.6 7L9.3 11.7L10.7 10.3L8.4 8H17.5C19.43 8 21 9.57 21 11.5V12H19V11.5C19 9.57 18.43 8 17.5 8ZM6.5 18H15.6L13.3 20.3L14.7 21.7L19.4 17L14.7 12.3L13.3 13.7L15.6 16H6.5C4.57 16 3 14.43 3 12.5V12H5V12.5C5 14.43 5.57 16 6.5 16Z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="status" class="status"></div>
        </header>

        <section class="transport">
            <button
                id="previousButton"
                class="icon-button"
                type="button"
                title="Previous"
                aria-label="Previous">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="6" width="2.5" height="12" />
                    <path d="M18 6L9 12L18 18Z" />
                </svg>
            </button>

            <button
                id="playPauseButton"
                class="icon-button"
                type="button"
                title="Play / Pause"
                aria-label="Play / Pause">
                <svg id="playPauseIcon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5L19 12L8 19Z" />
                </svg>
            </button>

            <button
                id="stopButton"
                class="icon-button"
                type="button"
                title="Stop"
                aria-label="Stop">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="7" y="7" width="10" height="10" rx="0.5" />
                </svg>
            </button>

            <button
                id="nextButton"
                class="icon-button"
                type="button"
                title="Next"
                aria-label="Next">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6L15 12L6 18Z" />
                    <rect x="17.5" y="6" width="2.5" height="12" />
                </svg>
            </button>
        </section>

        <section class="timeline">
            <span id="elapsed" class="time">0:00</span>

            <input
                id="progress"
                type="range"
                min="0"
                max="1000"
                value="0"
                disabled />

            <span id="duration" class="time">--:--</span>

            <label class="volume-control" title="Volume">
                <svg
                    class="volume-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path d="M4 9V15H8L13 19V5L8 9H4ZM15.5 12A3.5 3.5 0 0 0 14 9.13V14.87A3.5 3.5 0 0 0 15.5 12ZM15.5 5.82V7.88A5.5 5.5 0 0 1 15.5 16.12V18.18A7.5 7.5 0 0 0 15.5 5.82Z" />
                </svg>

                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                    aria-label="Volume" />
            </label>
        </section>

        <section id="playlist" class="playlist"></section>
    </main>

    <script src="datinate-webview.js"></script>
    <script src="../zipjs/zip.js"></script>
    <script src="datinate-zip.js"></script>
    <script src="datinate-archive.js"></script>
    <script src="datinate-browser-audio.js"></script>
    <script src="datinate-vgm.js"></script>
    <script src="datinate-audio.js"></script>
    <script src="datinate-audio-ui.js"></script>
</body>
</html>
